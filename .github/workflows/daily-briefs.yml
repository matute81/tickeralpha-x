name: Daily briefs

on:
  schedule:
    # 08:00 Hong Kong (UTC+8, no DST) = 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Sessions to generate
        type: choice
        options:
          - all
          - morning
          - close
          - week-ahead
        default: all

concurrency:
  group: daily-briefs
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CURSOR_MODEL: ${{ vars.CURSOR_MODEL }}
      ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      INPUT_MODE: ${{ github.event.inputs.mode || 'all' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Check secrets
        run: |
          if [ -z "$FMP_API_KEY" ]; then
            echo "Add repository secret FMP_API_KEY."
            exit 1
          fi
          if [ -z "$CURSOR_API_KEY" ] && [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "Add repository secret CURSOR_API_KEY (preferred), ANTHROPIC_API_KEY, or OPENAI_API_KEY."
            exit 1
          fi

      - name: Generate
        run: |
          python - <<'PY'
          import os
          import subprocess
          import sys

          mode = (os.environ.get("INPUT_MODE") or "all").strip()
          if os.environ.get("GITHUB_EVENT_NAME") == "schedule" or mode in {"", "all", "auto"}:
              modes = ["morning", "close", "week-ahead"]
          else:
              modes = [mode]
          print("sessions:", ", ".join(modes))
          for item in modes:
              print(f"::group::Generate {item}")
              subprocess.check_call([sys.executable, "scripts/generate_pack.py", "--mode", item])
              print("::endgroup::")
          PY

      - name: Publish drafts and Pages JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drafts docs/latest.json docs/prompts
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Publish daily briefs"
          git push
